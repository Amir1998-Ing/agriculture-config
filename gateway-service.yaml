spring:
  application:
    name: new-gateway
  cloud:
    gateway:
      routes:
        # Route d'authentification
        - id: authentification-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        # Route 1 : Agriculteur Service
        - id: agriculteur-service
          uri: lb://agriculteur-service
          predicates:
            - Path=/api/agriculteurs/**
          filters:
            - StripPrefix=1
          
        # Route 2 : Equipement Service
        - id: equipement-service
          uri: lb://equipement
          predicates:
            - Path=/api/equipements/**
          filters:
            - StripPrefix=1
          
        # Route 3 : Supervision Service
        - id: supervision-service
          uri: lb://supervision-service
          predicates:
            - Path=/api/supervision/**
          filters:
            - StripPrefix=1
      
      # Configuration CORS
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

# Configuration du serveur
server:
  port: 8888

# Message de test
config:
  message: "Gateway Service - Configuration depuis Git"

# Eureka Client
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:9095/eureka
  instance:
    prefer-ip-address: true

# Actuator - CONFIGURATION COMPLÈTE
management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true
  info:
    env:
      enabled: true
